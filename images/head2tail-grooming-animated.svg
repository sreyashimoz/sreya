<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d">
  <title id="t">Happy dog at the Head2Tail grooming spa</title>
  <desc id="d">A fluffy white dog with a green hair tie sits on a grooming table, wagging its tail while a brush combs its fur among floating bubbles and sparkles.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EEF3F8"/>
      <stop offset="70%" stop-color="#DCE6EF"/>
      <stop offset="100%" stop-color="#DCE6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F77A8"/>
      <stop offset="100%" stop-color="#244B6F"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F1E6D6"/>
    </linearGradient>
    <linearGradient id="earFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE3D3"/>
      <stop offset="100%" stop-color="#D9CBB6"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9D133"/>
      <stop offset="100%" stop-color="#8A9116"/>
    </linearGradient>
    <path id="star" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </defs>

  <style>
    * { transform-box: fill-box; }
    .breathe { transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
    .head    { transform-origin: 50% 90%;  animation: tilt 6s ease-in-out infinite; }
    .tail    { transform-origin: 0% 100%;  animation: wag 0.9s ease-in-out infinite; }
    .earL    { transform-origin: 70% 5%;   animation: earL 6s ease-in-out infinite; }
    .earR    { transform-origin: 30% 5%;   animation: earR 6s ease-in-out infinite; }
    .knot    { transform-origin: 50% 100%; animation: knot 3s ease-in-out infinite; }
    .eye     { transform-origin: 50% 50%;  animation: blink 5s infinite; }
    .tongue  { transform-origin: 50% 0%;   animation: pant 0.6s ease-in-out infinite; }
    .brush   { animation: brush 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    .puff    { opacity: 0; animation: puff 2.4s ease-out infinite; }
    .bubble  { opacity: 0; animation: rise 7s ease-in infinite; }
    .spark   { transform-origin: 50% 50%; animation: twinkle 2.8s ease-in-out infinite; }
    .shadow  { transform-origin: 50% 50%; animation: shadow 3.6s ease-in-out infinite; }

    @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.018); } }
    @keyframes tilt    { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-3deg); } 65% { transform: rotate(2.5deg); } }
    @keyframes wag     { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(10deg); } }
    @keyframes earL    { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(3deg); } 65% { transform: rotate(-2deg); } }
    @keyframes earR    { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(2deg); } 65% { transform: rotate(-3deg); } }
    @keyframes knot    { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    @keyframes blink   { 0%,44%,50%,100% { transform: scaleY(1); } 47% { transform: scaleY(0.1); } }
    @keyframes pant    { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.12); } }
    @keyframes brush   { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(10px,74px) rotate(5deg); } }
    @keyframes puff    { 0%,40% { opacity: 0; transform: translate(0,0); } 55% { opacity: .9; } 100% { opacity: 0; transform: translate(26px,-30px); } }
    @keyframes rise    { 0% { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: .85; } 85% { opacity: .6; } 100% { opacity: 0; transform: translateY(-330px) scale(1.1); } }
    @keyframes twinkle { 0%,100% { transform: scale(.3) rotate(0deg); opacity: 0; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
    @keyframes shadow  { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.02); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bubble, .spark { opacity: .8; }
      .puff { opacity: 0; }
    }
  </style>

  <!-- background -->
  <circle cx="400" cy="320" r="300" fill="url(#bg)"/>
  <circle cx="600" cy="160" r="70" fill="#EEF1B0" opacity=".55"/>
  <circle cx="190" cy="210" r="40" fill="#BFD1E1" opacity=".7"/>

  <!-- floor shadow -->
  <ellipse class="shadow" cx="400" cy="600" rx="210" ry="14" fill="#1A3A58" opacity=".12"/>

  <!-- grooming table -->
  <rect x="262" y="498" width="14" height="96" rx="6" fill="#244B6F"/>
  <rect x="524" y="498" width="14" height="96" rx="6" fill="#244B6F"/>
  <rect x="270" y="555" width="260" height="10" rx="5" fill="#244B6F"/>
  <rect x="220" y="480" width="360" height="24" rx="12" fill="url(#table)"/>
  <rect x="246" y="470" width="308" height="14" rx="7" fill="#132C44"/>

  <!-- tail (behind body) -->
  <g class="tail">
    <path d="M496 440 C 552 440, 606 410, 612 356 C 616 322, 592 302, 568 312 C 562 315, 562 322, 568 324 C 586 334, 588 356, 576 378 C 560 404, 528 416, 498 420 Z" fill="url(#fur)" stroke="#E6D8C4" stroke-width="2"/>
    <path d="M600 330 q-10 30 -30 56 M590 318 q4 -10 14 -8 M612 350 q8 -4 10 -12" stroke="#EADFCF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <g class="breathe">
    <!-- body -->
    <ellipse cx="400" cy="395" rx="118" ry="98" fill="url(#fur)"/>
    <path d="M300 420 C 305 455, 330 470, 352 472 M500 420 C 495 455, 470 470, 448 472" stroke="#E3D5C0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- chest fur strands -->
    <path d="M370 360 q8 20 0 40 M400 352 q8 24 0 50 M430 360 q-8 20 0 40" stroke="#EADFCF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- front legs -->
    <rect x="354" y="398" width="40" height="80" rx="20" fill="#FFFBF4"/>
    <rect x="406" y="398" width="40" height="80" rx="20" fill="#FFFBF4"/>
    <ellipse cx="374" cy="476" rx="26" ry="12" fill="#FFFDF8" stroke="#E6D8C4" stroke-width="2"/>
    <ellipse cx="426" cy="476" rx="26" ry="12" fill="#FFFDF8" stroke="#E6D8C4" stroke-width="2"/>
    <path d="M366 476 v6 M374 476 v7 M382 476 v6 M418 476 v6 M426 476 v7 M434 476 v6" stroke="#E0D1BB" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g class="head">
    <!-- ears -->
    <path class="earL" d="M332 222 C 296 236, 284 318, 300 372 C 310 400, 346 396, 350 362 C 354 318, 352 266, 348 228 Z" fill="url(#earFur)"/>
    <path class="earR" d="M468 222 C 504 236, 516 318, 500 372 C 490 400, 454 396, 450 362 C 446 318, 448 266, 452 228 Z" fill="url(#earFur)"/>
    <!-- head -->
    <circle cx="400" cy="255" r="86" fill="url(#fur)"/>
    <!-- topknot -->
    <g class="knot">
      <ellipse style="transform-box:view-box" cx="387" cy="154" rx="11" ry="20" transform="rotate(-22 387 154)" fill="#FFFDF8" stroke="#EADFCF" stroke-width="2"/>
      <ellipse style="transform-box:view-box" cx="413" cy="154" rx="11" ry="20" transform="rotate(22 413 154)" fill="#FFFDF8" stroke="#EADFCF" stroke-width="2"/>
      <ellipse cx="400" cy="146" rx="12" ry="25" fill="#FFFDF8" stroke="#EADFCF" stroke-width="2"/>
      <path d="M396 128 q4 16 0 34 M405 132 q3 12 0 28" stroke="#EFE5D6" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="387" y="168" width="26" height="10" rx="5" fill="#B3BB22"/>
      <rect x="391" y="170" width="10" height="3" rx="1.5" fill="#DCE163"/>
    </g>
    <!-- bangs -->
    <path d="M330 238 C 344 196, 456 196, 470 238 C 452 226, 436 240, 420 230 C 410 242, 390 242, 380 230 C 364 240, 348 226, 330 238 Z" fill="#FFFDF8"/>
    <!-- eyes -->
    <g class="eye">
      <circle cx="368" cy="254" r="9" fill="#2A1A12"/>
      <circle cx="371" cy="251" r="3" fill="#fff"/>
    </g>
    <g class="eye">
      <circle cx="432" cy="254" r="9" fill="#2A1A12"/>
      <circle cx="435" cy="251" r="3" fill="#fff"/>
    </g>
    <!-- cheeks -->
    <ellipse cx="350" cy="292" rx="13" ry="7" fill="#F7A9BC" opacity=".45"/>
    <ellipse cx="450" cy="292" rx="13" ry="7" fill="#F7A9BC" opacity=".45"/>
    <!-- muzzle -->
    <ellipse cx="400" cy="292" rx="44" ry="33" fill="#F3E3CC"/>
    <path d="M370 300 q-6 10 -2 18 M430 300 q6 10 2 18" stroke="#E2CFB2" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- tongue -->
    <path class="tongue" d="M390 300 Q 389 330, 400 332 Q 411 330, 410 300 Z" fill="#F28CA8"/>
    <path d="M400 306 v18" stroke="#E06E8E" stroke-width="2" stroke-linecap="round"/>
    <!-- mouth & nose -->
    <path d="M382 296 Q 391 306, 400 298 Q 409 306, 418 296" stroke="#2A1A12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M400 286 v10" stroke="#2A1A12" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="400" cy="281" rx="15" ry="10.5" fill="#1E1410"/>
    <ellipse cx="396" cy="277" rx="5" ry="2.5" fill="#fff" opacity=".6"/>
  </g>

  <!-- brush combing the right ear -->
  <g transform="translate(458 230) rotate(-6)">
    <g class="brush">
      <rect x="62" y="5" width="66" height="16" rx="8" fill="url(#handle)"/>
      <rect x="0" y="0" width="72" height="26" rx="12" fill="#2D5E8A"/>
      <rect x="8" y="5" width="56" height="5" rx="2.5" fill="#6F9CC4" opacity=".7"/>
      <path d="M10 26 v10 M20 26 v11 M30 26 v11 M40 26 v11 M50 26 v11 M60 26 v10" stroke="#1A3A58" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- loose fur puffs from brushing -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <path class="puff" d="M516 372 q8 -8 16 0 q8 8 16 0"/>
    <path class="puff" style="animation-delay:.3s" d="M528 342 q6 -6 12 0 q6 6 12 0"/>
  </g>

  <!-- bubbles -->
  <g fill="#FFFFFF" fill-opacity=".55" stroke="#8FB0CC" stroke-width="2.5">
    <circle class="bubble" cx="230" cy="470" r="14"/>
    <circle class="bubble" style="animation-delay:1.4s" cx="270" cy="490" r="9"/>
    <circle class="bubble" style="animation-delay:2.6s" cx="200" cy="480" r="20"/>
    <circle class="bubble" style="animation-delay:3.8s" cx="590" cy="480" r="12"/>
    <circle class="bubble" style="animation-delay:5s" cx="620" cy="470" r="17"/>
    <circle class="bubble" style="animation-delay:6.1s" cx="250" cy="460" r="7"/>
  </g>
  <g fill="#FFFFFF" opacity=".9">
    <circle class="bubble" cx="226" cy="466" r="3"/>
    <circle class="bubble" style="animation-delay:2.6s" cx="194" cy="474" r="4"/>
    <circle class="bubble" style="animation-delay:5s" cx="614" cy="464" r="3.5"/>
  </g>

  <!-- sparkles -->
  <g transform="translate(300 150)"><use class="spark" href="#star" fill="#C9D133"/></g>
  <g transform="translate(520 190)"><use class="spark" href="#star" fill="#6F9CC4" style="animation-delay:.9s"/></g>
  <g transform="translate(270 330)"><use class="spark" href="#star" fill="#FFFFFF" style="animation-delay:1.6s"/></g>
  <g transform="translate(560 420)"><use class="spark" href="#star" fill="#C9D133" style="animation-delay:2.2s"/></g>
  <g transform="translate(470 120) scale(.6)"><use class="spark" href="#star" fill="#2D5E8A" style="animation-delay:.4s"/></g>
</svg>
